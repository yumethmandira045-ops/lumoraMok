<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111c"><title>Lumora Market Signal</title>
  <link rel="icon" type="image/png" href="/lumora-logo.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="wrap">
    <header class="brand"><img class="brand-logo" src="/lumora-logo.png" alt="Lumora Market Signal logo"></header>
    <section class="market">
      <div class="symbol">XAUUSD <span>•</span> 1 MINUTE</div>
      <div id="statusCard" class="status waiting">
        <div id="statusIcon" class="status-icon">…</div>
        <h2 id="statusTitle">WAIT</h2>
        <p id="statusText">Waiting for MT5 signal…</p>
      </div>
      <div class="details">
        <div><span>Market</span><strong id="marketName">XAUUSD</strong></div>
        <div><span>Timeframe</span><strong>M1</strong></div>
        <div><span>Last update</span><strong id="lastUpdate">—</strong></div>
      </div>
      <p id="connection" class="connection">Connecting…</p>
    </section>
    <footer><p>This is a market-condition alert, not a guarantee of profit. Confirm conditions in MT5 before enabling a trading bot.</p><p class="muted">Updates every 5 seconds.</p></footer>
  </main>
  <script src="/app.js"></script>
</body></html>
